<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WP Plugins</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <a href="#"><img src="img/Logo.svg" alt="DugiMail" /></a>
      </div>
    </header>
    <main class="main">
      <div class="main__inner">
        <div class="main__title">
          <h1>Popular WordPress Plugins</h1>
        </div>
        <ul class="main__card-list">
          <li class="main__card">
            <div class="main__card-img">
              <img src="img/Main-img.png" alt="RubIcon plugin" />
            </div>
            <div class="main__card-title">
              <h2>RubIcon</h2>
              <p>$100</p>
            </div>
            <button class="button">Buy</button>
          </li>
          <li class="main__card">
            <div class="main__card-img">
              <img src="img/Main-img-2.png" alt="img" />
            </div>
            <div class="main__card-title">
              <h2>Camera</h2>
              <p>$200</p>
            </div>
            <button class="button">Buy</button>
          </li>
          <li class="main__card">
            <div class="main__card-img">
              <img src="img/Main-img-3.png" alt="img" />
            </div>
            <div class="main__card-title">
              <h2>G Generator</h2>
              <p>$1000</p>
            </div>
            <button class="button">Buy</button>
          </li>
          <li class="main__card">
            <div class="main__card-img">
              <img src="img/Main-img-4.png" alt="img" />
            </div>
            <div class="main__card-title">
              <h2>Invoice Creator</h2>
              <p>$100</p>
            </div>
            <button class="button">Buy</button>
          </li>
        </ul>
      </div>
    </main>
    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__info">
          <p>© DUGIMAIL. All rights reserved.</p>
          <p>
            If you have any questions please contact us
            <a href="#">sabrihakuli@outlook.com</a>
          </p>
        </div>
        <div class="footer__img">
          <a href="#">
            <img src="img/footer-facebook.svg" alt="facebook icon" />
          </a>
          <a href="#">
            <img src="img/footer-ball.svg" alt="Ball icon" />
          </a>
          <a href="#">
            <img src="img/footer-linkedin.svg" alt="LinkedIn icon" />
          </a>
          <a href="#">
            <img src="img/footer-insta.svg" alt="Instagram icon" />
          </a>
          <a href="#">
            <img src="img/footer-twitter.svg" alt="Twitter icon" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
